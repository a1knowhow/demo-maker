name: publish

# Dispatched by release.yml after a GitHub Release is created.
# Trusted Publisher on npm must allow this workflow file (publish.yml) for
# direct `npm publish` (OIDC / provenance).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck

      # Requires Trusted Publisher on npm allowing direct publish for this workflow.
      # Provenance is generated from GitHub Actions OIDC.
      - run: npm publish --provenance
