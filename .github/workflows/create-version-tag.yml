name: Create Version Tag

# Admin-only: bumps package.json on the default branch, commits, tags, then
# dispatches release.yml (GitHub Release → npm stage via publish.yml).
#
# Security (public repo):
# - workflow_dispatch is already limited to users with write access
# - this job additionally requires repository admin (not random collaborators)

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Optional version (e.g. 0.1.1 or v0.1.1).
          Empty = next patch after max(latest tag, package.json).
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: create-version-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create and push version tag
    runs-on: ubuntu-latest
    steps:
      - name: Require repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)"
          if [ "$perm" != "admin" ]; then
            echo "::error::Only repository admins can create version tags (actor=${GITHUB_ACTOR} permission=${perm})."
            exit 1
          fi
          echo "Actor ${GITHUB_ACTOR} has admin permission."

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          version_is_greater() {
            local candidate="${1#v}"
            local baseline="${2#v}"
            local candidate_major candidate_minor candidate_patch
            local baseline_major baseline_minor baseline_patch

            IFS='.' read -r candidate_major candidate_minor candidate_patch \
              <<< "$candidate"
            IFS='.' read -r baseline_major baseline_minor baseline_patch \
              <<< "$baseline"

            if (( 10#${candidate_major} != 10#${baseline_major} )); then
              (( 10#${candidate_major} > 10#${baseline_major} ))
              return
            fi
            if (( 10#${candidate_minor} != 10#${baseline_minor} )); then
              (( 10#${candidate_minor} > 10#${baseline_minor} ))
              return
            fi
            (( 10#${candidate_patch} > 10#${baseline_patch} ))
          }

          bump_patch() {
            local base="${1#v}"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$base"
            echo "v${major}.${minor}.$((10#${patch} + 1))"
          }

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$PKG_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version must be MAJOR.MINOR.PATCH (got ${PKG_VERSION})"
            exit 1
          fi

          LATEST_TAG="$(
            {
              git tag --list |
                grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' ||
                true
            } |
              sort -V |
              awk 'NF { latest = $0 } END { print latest }'
          )"
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          # Baseline for auto patch: greater of latest tag vs package.json
          BASELINE="$LATEST_TAG"
          if version_is_greater "v${PKG_VERSION}" "$LATEST_TAG"; then
            BASELINE="v${PKG_VERSION}"
          fi

          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="${VERSION_OVERRIDE#v}"
            VERSION="v${VERSION}"
          else
            VERSION="$(bump_patch "$BASELINE")"
          fi

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must use MAJOR.MINOR.PATCH format"
            exit 1
          fi

          if git rev-parse --quiet --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} already exists"
            exit 1
          fi

          if ! version_is_greater "$VERSION" "$LATEST_TAG"; then
            echo "::error::${VERSION} must be greater than latest tag ${LATEST_TAG}"
            exit 1
          fi

          {
            echo "latest_tag=${LATEST_TAG}"
            echo "version=${VERSION}"
            echo "version_name=${VERSION#v}"
            echo "default_branch=${DEFAULT_BRANCH}"
            echo "pkg_version_before=${PKG_VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${VERSION} (package.json was ${PKG_VERSION}, latest tag ${LATEST_TAG})"

      - name: Bump package.json, commit, tag, and push
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          DEFAULT_BRANCH: ${{ steps.version.outputs.default_branch }}
        run: |
          set -euo pipefail

          npm version "$VERSION_NAME" --no-git-tag-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "chore: release ${VERSION}"

          git tag "$VERSION"

          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "::error::Failed to push release commit to ${DEFAULT_BRANCH}. If branch protection blocks Actions, allow GitHub Actions to bypass or push rights for this workflow."
            exit 1
          fi
          git push origin "refs/tags/${VERSION}"

          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${VERSION} at ${COMMIT_SHA}"

      - name: Dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$VERSION"

      - name: Add workflow summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ steps.bump.outputs.commit_sha }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
          PKG_BEFORE: ${{ steps.version.outputs.pkg_version_before }}
        run: |
          {
            echo "## Version tag created"
            echo
            echo "- Tag: \`${VERSION}\`"
            echo "- package.json: \`${PKG_BEFORE}\` → \`${VERSION#v}\`"
            echo "- Previous tag: \`${LATEST_TAG}\`"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Dispatched: \`release.yml\` (GitHub Release → npm stage)"
          } >> "$GITHUB_STEP_SUMMARY"
