title: demo-maker
tagline: Open-source product demo video maker for websites
description: >-
  Open-source product demo video maker for websites. Create consistent
  website demo videos from YAML configuration with Playwright — no manual
  clicking or re-recording.
url: https://a1knowhow.github.io
baseurl: /demo-maker

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-sitemap

search_enabled: true
heading_anchors: true

# SSR fallback before JS; default for readers is system preference (see js/custom.js)
color_scheme: light

google_site_verification: PLeofoAxP71MoBgsJPpxHHO1wzdrD6oamkO-HtPqAhY

aux_links:
  "GitHub": https://github.com/a1knowhow/demo-maker
  "npm": https://www.npmjs.com/package/@a1knowhow/demo-maker
  "llms.txt": https://raw.githubusercontent.com/a1knowhow/demo-maker/main/llms.txt
aux_links_new_tab: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
